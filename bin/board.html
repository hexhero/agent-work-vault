<!doctype html>
<html lang="zh-CN" data-theme="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>TASK SWARM · Task board</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a14'/%3E%3Cg stroke='%238f9df0' stroke-width='2.5' opacity='.8'%3E%3Cpath d='M32 32 12 14M32 32 53 18M32 32 50 52M32 32 13 48'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%2314e6c2' stroke-width='3.5' stroke-dasharray='80 27' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='7.5' fill='%2314e6c2'/%3E%3Crect x='7' y='9' width='10' height='10' fill='%23ffb340'/%3E%3Crect x='48' y='13' width='10' height='10' fill='%2314e6c2'/%3E%3Crect x='45' y='47' width='10' height='10' fill='%23ff4658'/%3E%3Crect x='8' y='43' width='10' height='10' fill='%238f9df0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070a14; --panel:#0b0f1e; --raise:#131932; --line:rgba(160,175,255,.11); --line2:rgba(160,175,255,.24);
  --text:#e9ecf6; --dim:#949bb4; --faint:#5b627c; --ghost:#262c44; --wire:#8f9df0;
  --acc:#14e6c2; --acc-ink:#00201a; --block:#ff4658; --review:#ffb340; --ok:#5cb6ff; --todo:#aab1c8;
  --mono:"JetBrains Mono","SF Mono","IBM Plex Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
}
[data-theme=ember]{--acc:#ff6b2c;--acc-ink:#1a0900;--ok:#58d6a3;--review:#ffd23f}
[data-theme=ice]{--acc:#7cd4ff;--acc-ink:#001521;--ok:#58d6a3}
[data-theme=lime]{--acc:#c8f542;--acc-ink:#121a00;--ok:#5cb6ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.mono,.lbl,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.lbl b{font-weight:400;color:var(--dim);letter-spacing:.08em}
.none{padding:38px 0;text-align:center;color:var(--faint);font:11px var(--mono);letter-spacing:.2em}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:18px;padding:0 24px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line)}
header::before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--acc),transparent) no-repeat;background-size:22% 100%;animation:run 5s linear infinite}
@keyframes run{from{background-position:-30% 0}to{background-position:130% 0}}
.mark{width:22px;height:22px;position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:0;border:1.5px solid var(--acc);border-radius:50%;border-right-color:transparent;animation:spin 6s linear infinite}
.mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:corep 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corep{50%{transform:scale(.55);box-shadow:0 0 22px 3px var(--acc)}}
.word{font:600 13px var(--mono);letter-spacing:.34em;white-space:nowrap}
.word em{font-style:normal;color:var(--faint);font-weight:400;margin-left:14px;letter-spacing:.16em}
header .sp{flex:1}
.hk{display:flex;gap:30px;margin-left:26px}
.hk div{display:flex;flex-direction:column;line-height:1.25}
.hk .lbl{font-size:8.5px}
.hk b{font:500 15px var(--mono);letter-spacing:.02em}
.hk .now b{color:var(--acc)}
.themes{display:flex;gap:7px}
.themes i{width:11px;height:11px;border-radius:50%;background:var(--c);cursor:pointer;opacity:.4;transition:.2s;outline:1px solid transparent;outline-offset:2px}
.themes i:hover,.themes i.on{opacity:1}.themes i.on{outline-color:var(--c)}
.hstat{display:flex;align-items:center;gap:16px;font:11px var(--mono);letter-spacing:.1em;color:var(--dim);white-space:nowrap}
.live{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 8px;border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok);letter-spacing:.2em}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.live.off{color:var(--block);border-color:color-mix(in srgb,var(--block) 40%,transparent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

/* ---------- 舞台：关系图 ---------- */
#stage{position:relative;scroll-margin-top:56px;height:max(560px,calc(100vh - 56px - 282px));overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(900px 520px at 50% 55%,color-mix(in srgb,var(--wire) 9%,transparent),transparent 70%),
    radial-gradient(circle,rgba(160,175,255,.07) 1px,transparent 1.2px);background-size:auto,24px 24px}
#cv{position:absolute;inset:0;width:100%;height:100%}
#nodes{position:absolute;inset:0}
.scan{position:absolute;left:0;right:0;top:0;height:140px;pointer-events:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--wire) 3%,transparent) 75%,color-mix(in srgb,var(--wire) 12%,transparent) 99%,transparent);animation:scan 9s linear infinite}
@keyframes scan{from{transform:translateY(-160px)}to{transform:translateY(110vh)}}
.n{position:absolute;left:0;top:0;will-change:transform;cursor:pointer;user-select:none;z-index:1;
  transition:opacity .5s,border-color .3s,background .3s,box-shadow .3s,width .45s cubic-bezier(.2,.8,.2,1),color .3s}
.n.born{opacity:0!important}
.n.dim{opacity:.16}
.n.near{z-index:3}
.n.front{z-index:6}
.n:hover{z-index:7}

/* 项目：文件卡 */
.pj{width:138px;height:50px;padding:7px 10px 0;background:var(--panel);border:1px solid var(--line2);color:var(--dim);overflow:hidden}
.pj::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;
  background:linear-gradient(225deg,var(--bg) calc(50% - 1px),var(--line2) calc(50% - 1px),var(--line2) 50%,transparent 50%)}
.pj .nm{display:block;font:500 11.5px/1.3 var(--mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);opacity:.82}
.pj .pp{display:flex;align-items:center;gap:6px;margin-top:8px;font:9.5px var(--mono);color:var(--faint);white-space:nowrap}
.pj .pips{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.pj .pips i{width:7px;height:7px;background:var(--c);flex:none}
.pj .pips i.z{background:none;border:1px solid var(--ghost)}
.pj.hot{border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.pj.hot .nm{color:var(--c);opacity:1}
.pj.hot::before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:var(--c);opacity:.9}
.pj.near,.pj.front,.pj:hover{background:var(--raise);border-color:var(--wire);color:var(--text)}
.pj.near .nm,.pj.front .nm,.pj:hover .nm{opacity:1}
.pj.front{box-shadow:0 0 0 1px color-mix(in srgb,var(--wire) 35%,transparent),0 10px 40px -12px color-mix(in srgb,var(--wire) 70%,transparent)}

/* follow-up 跟进项：圆形节点。外圈虚线慢转，内圈雷达扫描，表示后台在盯 */
.fw{--c:var(--acc);width:50px;height:50px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 22%,var(--panel)),var(--panel) 72%);
  border:1px solid color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 22px -6px color-mix(in srgb,var(--c) 75%,transparent)}
.fw::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c) 50%,transparent);animation:spin 14s linear infinite}
.fw::after{content:"";position:absolute;inset:3px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 72%,color-mix(in srgb,var(--c) 55%,transparent) 99%,var(--c) 100%);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);animation:spin 3s linear infinite}
.fw b{position:relative;z-index:1;font:600 10.5px/1 var(--mono);letter-spacing:.04em;color:var(--text)}
.fw span{position:relative;z-index:1;margin-top:4px;font:8.5px/1 var(--mono);letter-spacing:.06em;color:var(--c)}
.fw.late{--c:var(--block)}.fw.late::after{animation-duration:1.4s}
.fw.paused{--c:var(--faint)}.fw.paused::before,.fw.paused::after{animation:none;opacity:.4}
.fw.near,.fw:hover,.fw.front{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 32%,var(--raise)),var(--raise) 72%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent),0 0 34px -4px color-mix(in srgb,var(--c) 85%,transparent)}
.fw.front{width:56px;height:56px}
#stage.m .fw{width:32px;height:32px}#stage.m .fw span{display:none}#stage.m .fw b{font-size:8.5px}

/* 任务 */
.tk{--c:var(--todo);width:104px;height:22px;padding:0 8px;background:var(--panel);border:1px solid color-mix(in srgb,var(--c) 34%,transparent);overflow:hidden}
.tk.doing{--c:var(--acc)}.tk.blocked{--c:var(--block)}.tk.review{--c:var(--review)}.tk.other{--c:var(--dim)}
.tk .hd{display:flex;align-items:center;gap:7px;height:20px;font:10px var(--mono);letter-spacing:.12em;color:var(--c);white-space:nowrap}
.tk .hd i{width:6px;height:6px;background:var(--c);flex:none;position:relative}
.tk.todo .hd i{background:none;border:1px solid var(--c)}
.tk .hd b{font-weight:600;color:var(--text);letter-spacing:.04em}
.tk .hd em{margin-left:auto;font-style:normal;color:var(--dim);letter-spacing:.02em}
.tk .ti,.tk .why,.tk .ft,.tk .fu{display:none}
.tk.act,.tk.front{width:188px;height:auto;padding:5px 10px 8px 12px;border-color:color-mix(in srgb,var(--c) 70%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 16%,transparent),0 0 30px -8px color-mix(in srgb,var(--c) 65%,transparent)}
.tk.act::before,.tk.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.tk.act .ti,.tk.front .ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:500 11.5px/1.35 var(--sans);height:31px;color:var(--text)}
.tk.act .hd i::after{content:"";position:absolute;inset:-1px;border:1px solid var(--c);animation:ring 1.8s ease-out infinite}
@keyframes ring{to{transform:scale(3.4);opacity:0}}
.tk.doing.act{animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 0 44px -4px color-mix(in srgb,var(--c) 80%,transparent)}}
.tk.blocked.act::before{animation:warn 1.3s steps(2,jump-none) infinite}
@keyframes warn{50%{opacity:.3}}
.tk.front{width:var(--fw,272px);background:var(--raise);padding:8px 14px 10px 16px}
.tk.front .hd{font-size:11px}
.tk.front .ti{font-size:13.5px;line-height:1.45;height:auto;-webkit-line-clamp:3}
.tk.front .why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:5px;font-size:11.5px;line-height:1.45;color:color-mix(in srgb,var(--c) 75%,#fff)}
.tk.front .ft{display:block;margin-top:5px;font:10px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.front .fu{display:block;margin-top:5px;font-size:11px;line-height:1.4;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.front .fu.late{color:var(--block)}
.tk.near,.tk:hover{background:var(--raise);border-color:var(--c)}
.tk.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 55%,var(--panel));box-shadow:0 0 60px color-mix(in srgb,var(--c) 70%,transparent)}}

/* skill：圆里的标签 */
.sk{height:18px;padding:0 7px;font:9.5px/16px var(--mono);letter-spacing:.02em;white-space:nowrap;color:var(--dim);
  background:color-mix(in srgb,var(--panel) 82%,var(--wire));border:1px solid color-mix(in srgb,var(--wire) 42%,transparent)}
.sk .f{display:none}
.sk.near,.sk:hover{color:var(--text);border-color:var(--wire);background:var(--raise)}
.sk.front{height:26px;padding:0 11px;font-size:12px;line-height:24px;color:var(--text);background:var(--raise);border-color:var(--wire);
  box-shadow:0 0 24px -6px var(--wire);max-width:var(--fw,none);overflow:hidden;text-overflow:ellipsis}
.sk.front .s{display:none}.sk.front .f{display:inline}
.sk.front b{font-weight:400;color:var(--acc);margin-left:8px}

/* 核心：Claude 用量 */
.core{width:132px;height:132px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 10%,var(--panel)) 0,var(--panel) 72%);
  border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 0 50px -6px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 0 26px -10px var(--acc);animation:corebeat 3.2s ease-in-out infinite}
@keyframes corebeat{50%{box-shadow:0 0 70px 0 color-mix(in srgb,var(--acc) 60%,transparent),inset 0 0 36px -8px var(--acc)}}
.core .cl{font:8.5px/1.5 var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.core .cm{font:500 10.5px/1.4 var(--mono);color:var(--acc);max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.core .cb{font:300 27px/1.12 var(--mono);letter-spacing:-.04em;color:var(--text)}
.core .c5{font:9.5px/1.5 var(--mono);color:var(--dim);letter-spacing:.06em}.core .c5 b{font-weight:500;color:var(--text)}
.core .spark{width:30px;height:30px;flex:none;animation:sparkle 5s ease-in-out infinite}
@keyframes sparkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(30deg) scale(1.12)}}
.core .cw{font:500 19px/1.15 "Tiempos Text","Copernicus","Source Serif 4",Georgia,"Times New Roman",serif;letter-spacing:.01em;color:#f3ede4;margin-top:1px}
.core .cq{display:flex;gap:9px;margin:3px 0 1px;font:9.5px/1.5 var(--mono);letter-spacing:.04em;white-space:nowrap}
.core .cq span{color:var(--c)}.core .cq b{font-weight:600;font-size:12px;color:var(--text)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:9px;margin:0 4px 0 2px;vertical-align:-1px}
.eq i{width:2px;background:var(--ok);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){animation-delay:-.2s}.eq i:nth-child(2){animation-delay:-.7s}.eq i:nth-child(3){animation-delay:-.45s}
@keyframes eq{0%,100%{height:2px}50%{height:9px}}

/* 筛选按钮 */
#filters{position:absolute;left:0;right:0;top:0;z-index:10;display:flex;gap:8px;padding:12px 18px;overflow-x:auto;scrollbar-width:none;
  background:linear-gradient(180deg,var(--bg) 30%,transparent)}
#filters::-webkit-scrollbar{display:none}
.fb{--c:var(--wire);position:relative;overflow:hidden;flex:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;cursor:pointer;
  font:11px var(--mono);letter-spacing:.12em;color:var(--dim);background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line2);transition:.2s}
.fb i{width:7px;height:7px;background:var(--c);flex:none}
.fb b{font-weight:500;color:var(--text);letter-spacing:0;min-width:12px;text-align:right}
.fb kbd{font:9px var(--mono);color:var(--faint);margin-left:2px}
.fb:hover{color:var(--text);border-color:var(--c)}
.fb.on{color:var(--bg);background:var(--c);border-color:var(--c);box-shadow:0 0 26px -4px var(--c)}
.fb.on i{background:var(--bg)}.fb.on b,.fb.on kbd{color:var(--bg)}
.fb.on::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent) no-repeat;background-size:40% 100%;animation:run 2.2s linear infinite}
.fb.all{--c:var(--text)}
.fb.zero{opacity:.45}
#alert{position:absolute;left:50%;top:58px;z-index:11;width:min(560px,calc(100% - 20px));transform:translate(-50%,-16px);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,.8,.2,1);
  background:color-mix(in srgb,var(--raise) 92%,transparent);backdrop-filter:blur(10px);border:1px solid var(--acc);box-shadow:0 0 50px -10px var(--acc),0 20px 50px -20px #000}
#alert.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#alert .at{position:relative;padding:7px 14px;border-bottom:1px solid var(--line)}
#alert .at .lbl b{color:var(--acc)}
#alert .bar{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--acc);transform-origin:left;animation:drain linear both}
@keyframes drain{to{transform:scaleX(0)}}
.ar{display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;font:11px var(--mono);white-space:nowrap}
.ar:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
.ar b{color:var(--text);min-width:34px}
.ar .o{color:var(--faint);text-decoration:line-through}.ar .aw{color:var(--faint)}
.ar .nw{color:var(--bg);background:var(--c);padding:0 6px;letter-spacing:.08em}
.ar .s{color:var(--c);border:1px solid var(--c);padding:0 6px;letter-spacing:.08em}
.ar .tt{font:12.5px var(--sans);color:var(--text);overflow:hidden;text-overflow:ellipsis;min-width:0}
#fold{position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:10;height:24px;padding:0 16px;cursor:pointer;
  font:10px var(--mono);letter-spacing:.16em;color:var(--dim);background:var(--panel);border:1px solid var(--line2);border-bottom:0;transition:.2s}
#fold:hover{color:var(--acc);border-color:var(--acc)}
body.full .dock{display:none}
body.full #stage{height:calc(100vh - 56px);height:calc(100dvh - 56px);border-bottom:0}
#hint{position:absolute;left:18px;bottom:12px;z-index:9;font:10px var(--mono);letter-spacing:.14em;color:var(--faint);pointer-events:none;display:flex;gap:14px;flex-wrap:wrap}
#hint span{display:inline-flex;align-items:center;gap:6px}#hint i{width:14px;height:2px;background:var(--c)}
#hint b{font-weight:400;color:var(--dim)}
#gstat{position:absolute;right:18px;bottom:12px;z-index:9;font:10px var(--mono);letter-spacing:.14em;color:var(--faint);pointer-events:none}

/* ---------- 底部面板 ---------- */
.dock{display:grid;grid-template-columns:1.2fr .9fr 1.1fr 1.2fr;gap:14px;padding:14px 18px 18px;height:282px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent,var(--acc),transparent) no-repeat;background-size:30% 100%;animation:run 7s linear infinite}
.panel:nth-child(2)::before{animation-delay:-1.8s}.panel:nth-child(3)::before{animation-delay:-3.5s}.panel:nth-child(4)::before{animation-delay:-5.3s}
.fr{display:grid;grid-template-columns:34px 38px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;margin:0 -8px;cursor:pointer;font-size:12.5px;color:var(--dim)}
.fr:hover{background:var(--raise);color:var(--text)}
.fr b{font:500 11px var(--mono);color:var(--acc)}.fr em{font:11px var(--mono);font-style:normal;color:var(--dim)}
.fr .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.fr .cd{font:10px var(--mono);color:var(--faint);white-space:nowrap}.fr .cd.late,.fr .cd.err{color:var(--block)}
.fr .cn{grid-column:3/-1;margin-top:-3px;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsv{display:flex;align-items:center;gap:6px;font:10px var(--mono);letter-spacing:.08em;color:var(--dim)}

  .ab{padding:18px 18px calc(40px + env(safe-area-inset-bottom))!important}

<body>
<header>
  <div class="mark"></div>
  <div class="word">TASK SWARM<em id="vaultName"></em></div>
  <div class="hk" id="hk"></div>
  <span class="sp"></span>
  <div class="themes" id="themes" title="Palette">
    <i data-theme-pick="teal" style="--c:#14e6c2"></i><i data-theme-pick="ember" style="--c:#ff6b2c"></i><i data-theme-pick="ice" style="--c:#7cd4ff"></i><i data-theme-pick="lime" style="--c:#c8f542"></i>
  </div>
  <div class="hstat"><span id="sync">Waiting for data</span><span class="clk" id="clock">--:--:--</span><span class="live off" id="live">OFFLINE</span></div>
</header>
<section id="stage">
  <canvas id="cv"></canvas><div class="scan"></div>
  <div id="nodes"></div>
  <div id="filters"></div>
  <div id="alert"></div>
  <div id="hint"></div><div id="gstat"></div><button id="fold" data-fold title="Collapse / expand the panels below (F)"></button>
</section>
<div class="dock">
  <section class="panel"><div class="phd"><span class="lbl">Attention · <b>Open tasks</b></span><span class="sp"></span><span class="lbl" id="qn"></span></div><div class="pbd" id="queue"><div class="none">LINKING…</div></div></section>
  <section class="panel"><div class="phd"><span class="lbl">Project load · <b>Tasks per project</b></span><span class="sp"></span><span class="lbl" id="ln"></span></div><div class="pbd" id="load"></div></section>
  <section class="panel" id="fpanel"><div class="phd"><span class="lbl">Follow-up · <b>Watched items</b></span><span class="sp"></span><span class="fsv" id="fsv"></span></div><div class="pbd" id="fus"></div><div class="fft" id="fft"></div></section>
  <section class="panel" id="feed"><div class="phd"><span class="lbl">Event stream · <b>Events</b></span><span class="sp"></span><span class="lbl" id="evn"></span></div><div class="evs" id="evs"></div></section>
</div>
<div class="veil" id="veil"></div>
<aside id="drawer"></aside>

<script>
const NONE = '_none';
const ORDER = {review:0, doing:1, blocked:2, other:3, todo:4, done:5, cancelled:6};
const NAME = {doing:'IN PROGRESS', review:'REVIEW', blocked:'BLOCKED', todo:'TO DO', other:'OTHER', done:'DONE', cancelled:'CANCELLED'};
const VAR = {doing:'acc', review:'review', blocked:'block', todo:'todo', other:'dim', done:'ok', cancelled:'faint'};
const COLOR = Object.fromEntries(Object.entries(VAR).map(([k, v]) => [k, `var(--${v})`]));
const ACTIVE = new Set(['doing', 'review', 'blocked']);
const UI = {state:null, usage:null, sel:null, prev:null, evPrev:null, logAll:new Set(), docs:{}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = s => String(s ?? '').replace(/\[((?:[^\[\]]|\[[^\]]*\])+)\]\([^)]*\)/g, '$1').replace(/[*`]/g, '');
const tkey = t => t.id || t.date + '|' + plain(t.title);   // 有内部编号的用编号认任务，改标题不会被当成新任务
const isOpen = t => t.status !== 'done' && t.status !== 'cancelled';
/* vault 的时区（board.py 按 vault.config.json / VAULT_TZ 给出，单位分钟） */
const tzMin = () => UI.state?.tz_offset_min ?? -new Date().getTimezoneOffset();
const tzStr = () => { const m = tzMin(), a = Math.abs(m); return (m < 0 ? '-' : '+') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); };
const today = () => new Date(Date.now() + tzMin() * 6e4).toISOString().slice(0, 10);
/* follow-up：截止时间是 vault 时区的 "YYYY-MM-DD HH:MM" */
const bjMs = s => Date.parse(s.replace(' ', 'T') + ':00' + tzStr());
const fuLeft = u => { if (!u) return ['no deadline', false]; const h = (bjMs(u) - Date.now()) / 36e5;
  return h <= 0 ? ['expired', true] : h < 24 ? [Math.max(1, Math.round(h)) + 'h left', true] : [Math.round(h / 24) + 'd left', false]; };
const fuOf = id => id ? ((UI.state?.followup?.items) || []).filter(f => f.task === id) : [];
const age = d => { const n = Math.round((Date.parse(today()) - Date.parse(d)) / 864e5); return n <= 0 ? 'today' : n + 'd ago'; };
const tok = n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K' : n.toLocaleString('en-US');
const sum = t => t.in + t.out + t.cw + t.cr;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el, from, to, fmt, ms = 900){
  if (from === to || STILL){ el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e)); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
  el.textContent = fmt(from); requestAnimationFrame(step);
}

/* ---- 极简 Markdown：先转义，再按行处理 ---- */
function inline(src){
  const codes = [];
  let s = esc(src).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\[((?:[^\[\]]|\[[^\]]*\])+)\]\(([^)\s]+)\)/g, (_, t, u) =>
    /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>` : `<span class="ilink" title="${u}">${t}</span>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(text){
  const lines = String(text || '').split('\n'), out = [];
  let para = [], i = 0;
  const flush = () => { if (para.length){ out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  while (i < lines.length){
    const line = lines[i];
    if (/^\s*```/.test(line)){
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line)){
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push('<table>' + body.map((r, n) => '<tr>' + cells(r).map(c => n ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))){ flush(); out.push('<h5>' + inline(m[2]) + '</h5>'); }
    else if ((m = line.match(/^(\s*)(?:[-*+]|\d+\.)\s+(.*)$/))){
      flush();
      const pad = Math.floor(m[1].replace(/\t/g, '  ').length / 2) * 16;
      const cb = m[2].match(/^\[(.)\]\s+(.*)$/);
      out.push(cb ? `<div class="li cb" style="margin-left:${pad}px"><span class="cbm">[${esc(cb[1])}]</span>${inline(cb[2])}</div>`
                  : `<div class="li" style="margin-left:${pad}px">${inline(m[2])}</div>`);
    }
    else if ((m = line.match(/^\s*>\s?(.*)$/))){ flush(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
    else if (!line.trim()) flush();
    else para.push(line.trim());
    i++;
  }
  flush();
  return out.join('');
}


/* ---- 数据整理 ---- */
function model(){
  const by = {};
  for (const p of UI.state.projects) by[p.id] = {...p, tasks:[]};
  for (const t of UI.state.tasks) for (const id of t.projects) (by[id] || by[NONE]).tasks.push(t);
  return Object.values(by).map(p => {
    p.tasks.sort((a, b) => ORDER[a.status] - ORDER[b.status] || b.date.localeCompare(a.date) || (b.start || '').localeCompare(a.start || ''));
    p.open = p.tasks.filter(isOpen);
    p.closed = p.tasks.filter(t => !isOpen(t));
    return p;
  });
}
const pname = p => p.id === NONE ? 'No project' : p.name;

/* ================= 关系图 ================= */
const G = {nodes:new Map(), edges:[], emap:new Map(), dots:[], focus:null, spot:new Map(), spotT:0, hover:null, W:0, H:0, cx:0, cy:0, R:0, hole:0, ko:0, top:56, m:false, rings:[], amb:[], booted:false, pal:{}};
const cv = $('cv'), ctx = cv.getContext('2d');
let DPR = 1;
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
function palette(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['acc', 'review', 'block', 'todo', 'dim', 'ok', 'faint', 'wire', 'text', 'bg']){
    const v = cs.getPropertyValue('--' + k).trim().replace('#', '');
    G.pal[k] = [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16)).join(',');
  }
}
const rgba = (k, a) => `rgba(${G.pal[k]},${a})`;
const shortSkill = id => { const s = id, n = G.m ? 10 : 13; return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function size(n){
  const m = G.m;
  if (n.kind === 'pj') return m ? [92, 30] : [138, 50];
  if (n.kind === 'tk') return n.mark ? (m ? [124, 40] : [188, 58]) : (m ? [50, 20] : [104, 22]);
  if (n.kind === 'sk') return m ? [n.short.length * 4.7 + 10, 14] : [n.short.length * 5.9 + 16, 18];
  if (n.kind === 'fw') return m ? [32, 32] : [50, 50];

}
function frontSize(n){
  if (G.m) return [n.fw || 160, n.kind === 'tk' ? 86 : n.kind === 'pj' ? 40 : 24];
  if (n.kind === 'tk') return [272, fuOf(n.data.id).length ? 170 : 150];
  if (n.kind === 'sk') return [n.data.id.length * 7.3 + 46, 26];
  if (n.kind === 'fw') return [56, 56];

/* 把一组矩形挤开：互不重叠、不压中心圆、不出界，同时被各自的锚点拉着 */
function relax(items, keep, iters = 260, gap = 10){
  const {W, H, cx, cy, top} = G;
  for (let it = 0; it < iters; it++){
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++){
      const a = items[i], b = items[j], dx = b.x - a.x, dy = b.y - a.y;
      const ox = (a.w + b.w) / 2 + gap - Math.abs(dx), oy = (a.h + b.h) / 2 + gap - Math.abs(dy);
      if (ox > 0 && oy > 0){
        if (ox * (G.m ? 2.4 : 1) < oy){ const s = (dx < 0 ? -1 : 1) * ox / 2; a.x -= s; b.x += s; }
        else { const s = (dy < 0 ? -1 : 1) * oy / 2; a.y -= s; b.y += s; }
      }
    }
    for (const a of items){
      a.x += (a.ax - a.x) * a.k; a.y += (a.ay - a.y) * a.k;
      const qx = clamp(cx, a.x - a.w / 2, a.x + a.w / 2), qy = clamp(cy, a.y - a.h / 2, a.y + a.h / 2), d = Math.hypot(qx - cx, qy - cy);
      if (d < keep){
        let ux = a.x - cx, uy = a.y - cy; const l = Math.hypot(ux, uy);
        if (l < 1){ const g = hash(a.id) * 6.283; ux = Math.cos(g); uy = Math.sin(g); } else { ux /= l; uy /= l; }
        a.x += ux * (keep - d); a.y += uy * (keep - d);
      }
      a.x = clamp(a.x, a.w / 2 + 6, W - a.w / 2 - 6); a.y = clamp(a.y, top + a.h / 2, H - a.h / 2 - 26);
    }
  }
}
/* 把标签一行行排进圆里，中间留出核心的洞；从中间往外排 */
function pack(items, R, rowH, hole, gap){
  const segs = [], nr = Math.floor((R - rowH * .7) / rowH);
  const ys = []; for (let k = -nr; k <= nr; k++) ys.push(k * rowH);
  ys.sort((a, b) => Math.abs(a) - Math.abs(b) || a - b);
  for (const y of ys){
    const half = Math.sqrt(R * R - y * y) - 8;
    if (Math.abs(y) < hole + rowH * .5){ const hx = Math.sqrt(Math.max(0, hole * hole - Math.max(0, Math.abs(y) - rowH * .5) ** 2)) + 8;
      if (half - hx > 30){ segs.push([hx, half, y]); segs.push([-half, -hx, y]); } }
    else segs.push([-half, half, y]);
  }
  let i = 0; const out = [];
  for (const [a, b, y] of segs){
    const row = []; let w = 0;
    while (i < items.length && w + items[i].w + (row.length ? gap : 0) <= b - a){ w += items[i].w + (row.length ? gap : 0); row.push(items[i++]); }
    let x = (a + b) / 2 - w / 2;
    for (const it of row){ out.push([it, x + it.w / 2, y]); x += it.w + gap; }
    if (i >= items.length) break;
  }
  for (let k = 0; i < items.length; i++, k++){ const g = Math.PI / 2 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * .32; out.push([items[i], Math.cos(g) * (R + 70), Math.sin(g) * (R + 70)]); }
  return out;
}

function build(){
  const st = UI.state; if (!st) return;
  const stage = $('stage'), W = stage.clientWidth, H = stage.clientHeight;
  DPR = Math.min(devicePixelRatio || 1, 2); cv.width = W * DPR; cv.height = H * DPR;
  Object.assign(G, {W, H, m:W < 720});
  stage.classList.toggle('m', G.m);
  const top = G.top = G.m ? 54 : 58, m = G.m;
  G.cx = W / 2; G.cy = top + (H - top - 20) / 2;
  G.R = m ? Math.min(W * .37, (H - top) * .2) : clamp(Math.min((H - top) * .36, W * .19), 120, 235);
  G.hole = m ? 48 : 66; G.ko = G.R + (m ? 32 : 58);
  const seen = new Set(), now = performance.now();
  let fresh = 0;
  const node = (id, kind, data, extra) => {
    seen.add(id); let n = G.nodes.get(id);
    if (!n){
      n = {id, x:G.cx, y:G.cy, s:.3, ts:1, ph:Math.random() * 6.283, ph2:Math.random() * 6.283, born:true, delay:now + (G.booted ? 0 : 250 + fresh++ * 22)};
      n.el = document.createElement('div'); n.el.dataset.node = id; n.el.className = 'n born'; $('nodes').appendChild(n.el); G.nodes.set(id, n);
    }
    return Object.assign(n, {kind, data}, extra);
  };
  const core = node('core', 'core', null); core.hx = G.cx; core.hy = G.cy; core.delay = now;
  const list = model().sort((a, b) => (a.id === NONE) - (b.id === NONE) || a.id.localeCompare(b.id));
  const rects = [], np = list.length;
  list.forEach((p, i) => {
    const top1 = p.open.length ? p.open[0].status : null;
    const n = node('p:' + p.id, 'pj', p, {mark:p.open.some(t => ACTIVE.has(t.status)), c:top1 ? VAR[top1] : null});
    const a = -Math.PI / 2 + (i + .5) * 2 * Math.PI / np, f = i % 2 ? 1 : (m ? .78 : .7);
    const rx = W / 2 - (m ? 50 : 84), ry = (H - top) / 2 - (m ? 26 : 40), co = Math.cos(a), si = Math.sin(a);
    const [w, h] = size(n);
    n.ax = G.cx + Math.sign(co) * Math.pow(Math.abs(co), .55) * rx * f; n.ay = G.cy + Math.sign(si) * Math.pow(Math.abs(si), .55) * ry * f;
    rects.push({id:n.id, n, x:n.ax, y:n.ay, ax:n.ax, ay:n.ay, w, h, k:.012});
  });
  G.dots = [];
  for (const p of list){
    const pn = G.nodes.get('p:' + p.id);
    const mine = p.open.filter(t => (t.projects[0] === p.id) || (p.id === NONE && !UI.state.projects.some(x => x.id === t.projects[0])));
    let ux = G.cx - pn.ax, uy = G.cy - pn.ay; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
    mine.forEach((t, k) => {
      const n = node('t:' + tkey(t), 'tk', t, {mark:ACTIVE.has(t.status), c:VAR[t.status], pn});
      const g = (k - (mine.length - 1) / 2) * .75, co = Math.cos(g), si = Math.sin(g), dist = m ? 58 : 124;
      const [w, h] = size(n), ax = pn.ax + (ux * co - uy * si) * dist, ay = pn.ay + (ux * si + uy * co) * dist;
      rects.push({id:n.id, n, x:ax, y:ay, ax, ay, w, h, k:m ? .006 : .03});
      /* follow-up 跟进项：圆形节点，挂在任务卡背向项目的一侧，一起参与防重叠；任务卡调到前景时跟着走（见 frame） */
      const fs = (st.followup?.items || []).filter(f => t.id && f.task === t.id);
      fs.forEach((f, j) => {
        let vx = ax - pn.ax, vy = ay - pn.ay; const vl = Math.hypot(vx, vy) || 1;
        const a0 = Math.atan2(vy / vl, vx / vl) + (j - (fs.length - 1) / 2) * .7 + (m ? 0 : .35), [lt, late] = fuLeft(f.until);
        const fn = node('f:' + f.id, 'fw', {...f, description:`${f.id} · ${f.title}\nWatching: ${f.cond}\n${f.until ? 'Until ' + f.until + ' (' + lt + ')' : 'No deadline'}${f.last_check ? '\nLast checked ' + f.last_check : ''}`},
          {tn:n, ux:Math.cos(a0), uy:Math.sin(a0), c:f.paused ? 'faint' : late ? 'block' : 'acc', lt:f.paused ? 'paused' : lt.replace(' left', ''), late, paused:!!f.paused});
        fn.el.dataset.open = 't:' + tkey(t);
        const [fw, fh] = size(fn), r = Math.min(w / 2 / (Math.abs(fn.ux) || 1e-6), h / 2 / (Math.abs(fn.uy) || 1e-6)) + fw / 2 + (m ? 26 : 62);
        const fx = ax + fn.ux * r, fy = ay + fn.uy * r;
        rects.push({id:fn.id, n:fn, x:fx, y:fy, ax:fx, ay:fy, w:fw + 16, h:fh + 16, k:m ? .01 : .05});
      });
    });
    p.closed.forEach((t, k) => {
      if (t.projects[0] !== p.id && p.id !== NONE) return;
      const r = (m ? 20 : 34) + (m ? 4.4 : 7.4) * Math.sqrt(k + 1), g = k * 2.39996 + hash(p.id) * 6;
      G.dots.push({id:'d:' + tkey(t), kind:'dot', t, pn, ox:Math.cos(g) * r, oy:Math.sin(g) * r * .8, px:0, py:0});
    });
  }
  relax(rects, G.ko, m ? 700 : 420, m ? 6 : 10);
  for (const r of rects){ r.n.hx = r.x; r.n.hy = r.y; }
  const skills = [...(st.skills || [])].sort((a, b) => b.uses - a.uses || a.id.localeCompare(b.id));
  const sn = skills.map(s => { const n = node('s:' + s.id, 'sk', s, {}); n.short = shortSkill(s.id); [n.w, n.h] = size(n); return n; });
  for (const [n, dx, dy] of pack(sn, G.R - 2, m ? 17 : 24, G.hole + (m ? 0 : 4), m ? 4 : 7)){ n.hx = G.cx + dx; n.hy = G.cy + dy; }
  for (const [id, n] of G.nodes) if (!seen.has(id)){ n.el.remove(); G.nodes.delete(id); }

  const E = [], emap = new Map();
  const edge = (a, b, kind, color, base) => {
    if (!a || !b) return; const key = a.id + '>' + b.id;
    if (emap.has(key)) return;

    const e = {a, b, kind, color, base, key, bend:(h - .5) * .36 + (h > .5 ? .05 : -.05), al:old ? old.al : 0, sp:.16 + hash(key + 's') * .16, off:hash(key + 'o')};
    E.push(e); emap.set(key, e);
  };
  const N = id => G.nodes.get(id);
  for (const p of list) edge(N('p:' + p.id), core, 'pc', null, .13);
  for (const s of skills) for (const pid of s.projects) edge(N('s:' + s.id), N('p:' + pid), 'sp', null, .11);
  for (const t of st.tasks){
    if (!isOpen(t)) continue;
    const n = N('t:' + tkey(t)); if (!n) continue;
    const c = n.mark ? VAR[t.status] : null;
    for (const pid of t.projects) edge(n, N('p:' + pid) || N('p:' + NONE), 'tp', c, .26);
    if (n.mark) edge(n, core, 'tc', c, 0);
    for (const s of t.skills || []) edge(n, N('s:' + s), 'ts', c, .22);
  }
  for (const n of G.nodes.values()) if (n.kind === 'fw') edge(n, n.tn, 'ft', n.c, .5);
  for (const d of G.dots){ edge(d, d.pn, 'dp', null, .075); if (hash(d.id) < .6) edge(d, core, 'dc', null, .028);
    for (const s of d.t.skills || []) edge(d, N('s:' + s), 'ds', null, .05); }
  G.edges = E; G.emap = emap; G.booted = true;
  $('gstat').textContent = `${G.nodes.size + G.dots.length} NODES · ${E.length} LINKS`;
  paint(); coreView();
}

const eff = () => G.spot.size ? 'spot' : G.focus;   // 有任务变化时，自动聚光盖过手动选的前景
const frontOf = n => { const f = eff(); if (!f || n.kind === 'core') return false;
  if (n.kind === 'fw') return frontOf(n.tn);
  if (f === 'spot') return G.spot.has(n.id);
  if (f === 'project') return n.kind === 'pj'; if (f === 'skill') return n.kind === 'sk';
  if (n.kind !== 'tk') return false;
  return f === 'todo' ? (n.data.status === 'todo' || n.data.status === 'other') : n.data.status === f; };

function formation(F){
  for (const n of G.nodes.values()){ n.fx = n.fy = null; n.fw = 0; }
  const arr = [...F].filter(n => n.kind !== 'fw'); if (!arr.length) return;   // 跟进项节点不排队形，跟着自己的任务卡走
  const kind = arr[0].kind, {W, H, top, cx, cy, m} = G;
  if (m){
    const cols = kind === 'tk' ? 1 : 2, cw = (W - 16) / cols, rows = Math.ceil(arr.length / cols), avail = H - top - 34;
    const rh = Math.min(kind === 'tk' ? 98 : kind === 'pj' ? 50 : 34, avail / rows), y0 = top + (avail - rows * rh) / 2 + rh / 2;
    arr.sort((a, b) => kind === 'tk' ? 0 : a.data.id.localeCompare(b.data.id));
    arr.forEach((n, i) => { n.fx = 8 + cw * (i % cols + .5); n.fy = y0 + Math.floor(i / cols) * rh; n.fw = cw - 8; });
  } else if (kind === 'sk'){
    const items = arr.sort((a, b) => b.data.uses - a.data.uses).map(n => ({n, w:frontSize(n)[0]}));
    const R2 = Math.min(G.R * 1.7, (H - top) / 2 - 8);
    for (const [it, dx, dy] of pack(items, R2, 38, G.hole + 26, 12)){ it.n.fx = cx + dx * 1.18; it.n.fy = cy + dy; }
  } else if (kind === 'tk' && arr.length <= 12){
    arr.sort((a, b) => Math.atan2(a.hy - cy, a.hx - cx) - Math.atan2(b.hy - cy, b.hx - cx));
    const rx = G.R + 200, ry = G.R + 20;
    const items = arr.map(n => { const g = Math.atan2(n.hy - cy, n.hx - cx), [w, h] = frontSize(n);
      const x = cx + Math.cos(g) * rx, y = cy + Math.sin(g) * ry; return {id:n.id, n, x, y, ax:x, ay:y, w, h, k:.02}; });
    relax(items, G.R + 56, 320, 12);
    for (const it of items){ it.n.fx = it.x; it.n.fy = it.y; }
  }
}

function nodeHTML(n){
  if (n.kind === 'pj'){
    const p = n.data, pips = p.open.map(t => `<i class="${t.status === 'todo' ? 'z' : ''}" style="--c:${COLOR[t.status]}"></i>`).join('');
    return `<b class="nm">${esc(pname(p))}</b><div class="pp"><span class="pips">${pips}</span><span class="ct">${p.open.length ? p.open.length + ' open · ' : ''}${p.closed.length}✓</span></div>`;
  }
  if (n.kind === 'tk'){
    const t = n.data, why = (t.detail.match(/(?:卡在|待确认|Blocked on|Pending)[：:]\s*(.+)/) || [])[1], ref = t.refs.find(r => /^[A-Z]/.test(r));
    const pj = t.projects.map(id => id === NONE ? 'No project' : id).join(' · ');
    const fu = fuOf(t.id), f0 = fu[0], [lt, late] = f0 ? fuLeft(f0.until) : ['', false];
    return `<div class="hd"><i></i><b>${esc(t.id || '—')}</b><span>${NAME[t.status] || esc(t.label)}</span>${ref ? `<em>${esc(ref)}</em>` : ''}</div>
      <div class="ti">${esc(plain(t.title))}</div>${why ? `<div class="why">${esc(plain(why))}</div>` : ''}${f0 ? `<div class="fu${late ? ' late' : ''}">Watch ${esc(f0.id)}: ${esc(f0.cond)} · ${lt}</div>` : ''}<div class="ft">${esc(pj)} · ${age(t.date)}${t.reporter ? ' · ' + esc(t.reporter) : ''}</div>`;
  }
  if (n.kind === 'fw') return `<b>${esc(n.data.id)}</b><span>${esc(n.lt)}</span>`;
  if (n.kind === 'sk') return `<span class="s">${esc(n.short)}</span><span class="f">${esc(n.data.id)}<b>${n.data.uses}</b></span>`;
  return null;
}
function paint(){
  const F = new Set(), near = new Set();
  for (const n of G.nodes.values()) if (frontOf(n)) F.add(n);
  const h = G.nodes.get(G.hover) || G.nodes.get(UI.sel);
  for (const e of G.edges){
    e.lit = F.has(e.a) || F.has(e.b) || (h && (e.a === h || e.b === h)) || (eff() === 'done' && e.kind === 'dp');
    if (e.lit){ near.add(e.a); near.add(e.b); }
  }
  formation(F);
  for (const n of G.nodes.values()){
    n.front = F.has(n);
    const nr = !n.front && (near.has(n) || n === h), dim = eff() && !n.front && !nr && n.kind !== 'core';
    [n.w, n.h] = n.front ? frontSize(n) : size(n);
    n.ts = n.front ? (n.kind === 'pj' && !G.m ? 1.14 : 1) : dim ? .9 : 1;
    const cls = ['n', n.kind === 'core' ? 'core' : n.kind];
    if (n.kind === 'tk') cls.push(n.data.status);
    if (n.kind === 'fw'){ if (n.late) cls.push('late'); if (n.paused) cls.push('paused'); }
    if (n.mark) cls.push(n.kind === 'pj' ? 'hot' : 'act');
    if (n.front) cls.push('front'); if (nr) cls.push('near'); if (dim) cls.push('dim'); if (n.born) cls.push('born'); if (n.flash) cls.push('flash');
    n.el.className = cls.join(' '); n.flash = false;
    n.el.style.setProperty('--fw', n.fw ? n.fw + 'px' : '');
    if (n.c) n.el.style.setProperty('--c', `var(--${n.c})`);
    const html = nodeHTML(n);
    if (html !== null && html !== n.html){ n.el.innerHTML = n.html = html; n.el.title = n.kind === 'tk' ? '' : (n.data.description || ''); }
  }
  document.querySelectorAll('.fb').forEach(b => b.classList.toggle('on', !G.spot.size && !!G.focus && b.dataset.focus === G.focus));
  const lg = (c, t) => `<span style="--c:var(--${c})"><i></i>${t}</span>`;
  $('hint').innerHTML = G.spot.size ? '<b>Tasks changed and were brought to the front · click anywhere or press Esc to restore</b>' : G.focus ? `<b>${esc(FOCUS.find(f => f[0] === G.focus)[1])} brought to the front · click again or press Esc to restore</b>` : lg('acc', 'In progress') + lg('review', 'Review') + lg('block', 'Blocked') + lg('wire', 'Related');
}

/* ---- 每帧：节点位置 + 画线 ---- */
const bez = (e, t) => { const u = 1 - t; return [u * u * e.x0 + 2 * u * t * e.qx + t * t * e.x1, u * u * e.y0 + 2 * u * t * e.qy + t * t * e.y1]; };
function port(n, tx, ty){   // 线从卡片边上哪个点出来
  if (!n.w || n.kind === 'core' || n.kind === 'dot') return null;
  const dx = tx - n.px, dy = ty - n.py, w = n.w * n.s / 2 + 3, h = n.h * n.s / 2 + 3;
  const k = Math.min(w / (Math.abs(dx) || 1e-6), h / (Math.abs(dy) || 1e-6));
  return [n.px + dx * k, n.py + dy * k];
}
function frame(ts){
  requestAnimationFrame(frame);
  if (document.hidden || !G.nodes.size) return;
  const t = ts / 1000, k = STILL ? 1 : .085;
  for (const n of G.nodes.values()){
    if (n.born){ if (ts < n.delay) { n.px = n.x; n.py = n.y; n.el.style.transform = `translate(${n.x}px,${n.y}px) translate(-50%,-50%) scale(.3)`; continue; } n.born = false; n.el.classList.remove('born'); }
    if (n.kind === 'fw'){ const tn = n.tn;
      if (tn.front && tn.fx != null){ const w = (tn.w || 100) * tn.ts / 2, h = (tn.h || 22) * tn.ts / 2;
        const r = Math.min(w / (Math.abs(n.ux) || 1e-6), h / (Math.abs(n.uy) || 1e-6)) + (n.w || 50) / 2 + (G.m ? 18 : 44);
        n.fx = tn.fx + n.ux * r; n.fy = tn.fy + n.uy * r; } else n.fx = n.fy = null; }
    n.x += ((n.fx ?? n.hx) - n.x) * k; n.y += ((n.fy ?? n.hy) - n.y) * k; n.s += (n.ts - n.s) * k * 1.4;
    const amp = STILL || n.kind === 'core' ? 0 : n.front ? 1.6 : n.kind === 'sk' ? 2 : 4.5;
    n.px = n.x + Math.sin(t * .5 + n.ph) * amp; n.py = n.y + Math.cos(t * .41 + n.ph2) * amp;
    n.el.style.transform = `translate(${n.px.toFixed(1)}px,${n.py.toFixed(1)}px) translate(-50%,-50%) scale(${n.s.toFixed(3)})`;
  }

/* ---- 详情抽屉：任务 / 项目 / skill / 用量 ---- */
const sec = (en, zh) => `<div class="sec"><span class="lbl">${en} · <b>${zh}</b></span></div>`;
const mini = t => `<div class="mini ${t.status}" style="--c:${COLOR[t.status]}" data-open="t:${esc(tkey(t))}"><span class="ck">${t.status === 'done' ? '✓' : t.status === 'cancelled' ? '×' : '■'}</span><span class="tt">${t.id ? esc(t.id) + ' ' : ''}${esc(plain(t.title))}</span><span class="dt">${isOpen(t) ? NAME[t.status] + ' · ' : ''}${t.date.slice(5)}</span></div>`;
const shell = (tag, c, sub, title, body) => `<div class="ah"><div class="top"><span class="tag" style="--c:${c}">${tag}</span>${sub}<button class="x" data-close>✕</button></div><h2>${title}</h2></div><div class="ab">${body}</div>`;
function drawer(){
  const [k, id] = UI.sel === 'core' ? ['u'] : [UI.sel[0], UI.sel.slice(2)], D = $('drawer');
  const top = D.querySelector('.ab')?.scrollTop || 0, same = D.dataset.key === UI.sel;
  let html = null;
  if (k === 'u') html = shell('CLAUDE', 'var(--acc)', '<span class="lbl">Local Claude Code session records</span>', 'Claude usage', usageHTML());
  else if (k === 'p'){
    const p = model().find(x => x.id === id);
    if (p){ const logs = (UI.logAll.has(p.id) ? p.log : p.log.slice(0, 3)).map(e => `<div class="lg"><div class="d">${e.date}</div><div class="md">${md(e.body)}</div></div>`).join('')
        + (p.log.length > 3 ? `<button class="btn" style="margin:10px 0 0 21px" data-more="${esc(p.id)}">${UI.logAll.has(p.id) ? 'Show less' : (p.log.length - 3) + ' earlier days'}</button>` : '');
      const sk = (UI.state.skills || []).filter(s => s.projects.includes(p.id));
      html = shell('PROJECT', 'var(--wire)', `<span class="lbl">${p.id === NONE ? '' : 'projects/' + esc(p.id) + '.md'}</span>`, esc(p.name),
        `<div class="md"><p>${esc(p.description)}</p></div>${p.aliases.length ? `<div class="lbl" style="letter-spacing:.06em;text-transform:none">${esc(p.aliases.join(' · '))}</div>` : ''}
        ${p.open.length ? sec('Open', p.open.length + ' open') + p.open.map(mini).join('') : ''}
        ${sk.length ? sec('Skills', 'Related skills') + sk.map(s => `<div class="mini" data-open="s:${esc(s.id)}"><span class="ck" style="color:var(--wire)">◆</span><span class="tt">${esc(s.id)}</span><span class="dt">${s.uses} mentions</span></div>`).join('') : ''}
        ${p.log.length ? sec('Log', 'Project log · ' + p.log.length + ' days') + logs : ''}
        ${p.closed.length ? sec('Closed', p.closed.length + ' done / cancelled') + p.closed.map(mini).join('') : ''}`); }
  } else if (k === 's'){
    const s = (UI.state.skills || []).find(x => x.id === id);
    if (s){ const names = Object.fromEntries(UI.state.projects.map(p => [p.id, p.name])), ts = UI.state.tasks.filter(t => (t.skills || []).includes(s.id));
      html = shell('SKILL', 'var(--wire)', `<span class="lbl">skills/${esc(s.id)}/SKILL.md</span>`, esc(s.id),
        `<div class="md"><p>${esc(s.description)}</p></div><div class="lbl" style="letter-spacing:.06em;text-transform:none">Mentioned ${s.uses} times in tasks and project logs</div>
        ${s.projects.length ? sec('Projects', 'Projects linked from the skill') + s.projects.map(pid => `<div class="mini" data-open="p:${esc(pid)}"><span class="ck" style="color:var(--wire)">▣</span><span class="tt">${esc(names[pid] || pid)}</span><span class="dt"></span></div>`).join('') : ''}
        ${ts.length ? sec('Tasks', ts.length + ' tasks mention it') + ts.map(mini).join('') : ''}`); }
  } else {
    const t = UI.state.tasks.find(x => tkey(x) === id);
    if (t){
      const names = Object.fromEntries(UI.state.projects.map(p => [p.id, p])), refs = t.refs.filter(r => /^[A-Z]/.test(r)), related = [];
      if (refs.length) for (const pid of t.projects) for (const e of names[pid]?.log || []){
        const hit = e.body.split(/\n(?=- )/).filter(b => refs.some(r => b.includes(r)));
        if (hit.length) related.push({date:e.date, project:names[pid].name, body:hit.join('\n')});
      }
      const doc = t.doc ? UI.docs[t.doc] : null;
      if (t.doc && doc === undefined){
        UI.docs[t.doc] = null;
        fetch('api/doc?path=' + encodeURIComponent(t.doc)).then(r => r.ok ? r.text() : '(could not read this detail doc)').then(x => { UI.docs[t.doc] = x; if (UI.sel === 't:' + tkey(t)) drawer(); });
      }
      html = shell(esc(NAME[t.status] || t.label), COLOR[t.status] || 'var(--dim)', `${t.id ? `<span class="mono" style="font-size:13px;font-weight:600">${esc(t.id)}</span>` : ''}<span class="lbl">task/${t.date}.md:${t.line}</span>`, inline(t.title),
        `<div class="kv">
          <div><span class="lbl">Date</span><span class="mono">${t.date} · ${age(t.date)}</span></div>
          <div><span class="lbl">Time</span><span class="mono">${t.start || '—'}${t.end ? ' → ' + t.end : ''}</span></div>
          <div><span class="lbl">Project</span><span>${esc(t.projects.map(pid => names[pid]?.name || pid).join(', '))}</span></div>
          <div><span class="lbl">ClickUp</span><span class="mono">${esc(refs.join('  ')) || '—'}</span></div>
          ${t.type ? `<div style="grid-column:1/-1"><span class="lbl">Type</span><span>${esc(t.type)}</span></div>` : ''}${t.reporter ? `<div style="grid-column:1/-1"><span class="lbl">Reporter</span><span>${esc(t.reporter)}</span></div>` : ''}
          ${(t.skills || []).length ? `<div style="grid-column:1/-1"><span class="lbl">Skills</span><span class="mono">${esc(t.skills.join('  '))}</span></div>` : ''}</div>
        ${sec('Content', 'Task notes')}
        ${t.detail ? `<div class="md">${md(t.detail)}</div>` : `<div class="lbl" style="letter-spacing:.06em;text-transform:none">${t.projects[0] === NONE ? 'No notes on this task' : 'Project tasks stay one line; the story is in the project log'}</div>`}
        ${fuOf(t.id).map(f => sec('Follow-up', 'Watched item ' + esc(f.id)) + `<div class="kv">
          <div style="grid-column:1/-1"><span class="lbl">Watching</span><span>${esc(f.cond)}</span></div>
          <div><span class="lbl">Until</span><span class="mono">${esc(f.until || 'no deadline')} · ${fuLeft(f.until)[0]}</span></div>
          <div><span class="lbl">Last checked</span><span class="mono">${esc(f.last_check || '—')}</span></div>
          ${f.paused ? `<div style="grid-column:1/-1"><span class="lbl">Paused</span><span>${esc(f.paused)}</span></div>` : ''}
          ${f.last_error ? `<div style="grid-column:1/-1"><span class="lbl">Result</span><span>${esc(f.last_error)}</span></div>` : ''}</div>
          <div class="md"><p><b>Then: </b>${esc(f.action || '')}</p>${f.on_expire ? `<p><b>On expiry: </b>${esc(f.on_expire)}</p>` : ''}</div>`).join('')}
        ${t.doc ? sec('Detail doc', esc(t.doc)) + `<div class="md">${doc ? md(doc) : '<div class="lbl">LOADING…</div>'}</div>` : ''}
        ${related.length ? sec('Related log', 'Project log entries mentioning ' + esc(refs.join(', '))) + related.map(r => `<div class="rel"><div class="lbl" style="color:var(--acc);margin-bottom:4px">${r.date} · ${esc(r.project)}</div><div class="md">${md(r.body)}</div></div>`).join('') : ''}`);
    }
  }
  if (html === null) return closeDrawer();
  D.dataset.key = UI.sel; D.innerHTML = html;
  if (same) D.querySelector('.ab').scrollTop = top;
  D.classList.add('on'); $('veil').classList.add('on');
}
function closeDrawer(){ UI.sel = null; $('drawer').classList.remove('on'); $('veil').classList.remove('on'); paint(); }

/* ---- 交互 ---- */
function theme(name){
  document.documentElement.dataset.theme = name;
  try { localStorage.setItem('board-theme-v2', name); } catch (e) {}
  palette();
  document.querySelectorAll('[data-theme-pick]').forEach(el => el.classList.toggle('on', el.dataset.themePick === name));
}
/* 新任务、状态变了：自动调到前景 SPOT_MS 毫秒，和点按钮的效果一样 */
const SPOT_MS = 20000;
function spotlight(changes){
  for (const c of changes) G.spot.set('t:' + c.k, c);
  const rows = [...G.spot.values()].sort((a, b) => ORDER[a.s] - ORDER[b.s]);
  $('alert').innerHTML = `<div class="at"><span class="lbl"><b>Task changes</b> · ${rows.length}</span><i class="bar" style="animation-duration:${SPOT_MS}ms"></i></div>` + rows.map(c =>
    `<div class="ar" data-open="t:${esc(c.k)}" style="--c:${COLOR[c.s]}"><b>${esc(c.id || '·')}</b>${c.old ? `<span class="o">${NAME[c.old]}</span><span class="aw">→</span>` : '<span class="nw">NEW</span>'}<span class="s">${NAME[c.s]}</span><span class="tt">${esc(plain(c.title))}</span></div>`).join('');
  $('alert').classList.add('on');
  clearTimeout(G.spotT); G.spotT = setTimeout(clearSpot, SPOT_MS);
  paint();
  for (const c of changes){ const id = G.nodes.has('t:' + c.k) ? 't:' + c.k : G.nodes.has('p:' + c.p) ? 'p:' + c.p : 'core'; G.nodes.get(id).flash = id[0] === 't'; ring(id, VAR[c.s]); ring(id, VAR[c.s], .9); }
  paint();
  if (G.m) $('stage').scrollIntoView({behavior:STILL ? 'auto' : 'smooth', block:'start'});
}
function clearSpot(){ if (!G.spot.size) return false; clearTimeout(G.spotT); G.spot.clear(); $('alert').classList.remove('on'); paint(); return true; }
function setFull(on){
  document.body.classList.toggle('full', on); $('fold').textContent = on ? '▴ Show panels' : '▾ Hide panels';
  try { localStorage.setItem('board-full', on ? '1' : ''); } catch (e) {}
  if (on) scrollTo(0, 0);
  build();
}
function setFocus(f){
  clearSpot();
  G.focus = f && f !== G.focus ? f : null; paint();
  if (G.focus) for (const n of G.nodes.values()) if (n.front) ring(n.id, n.c || 'wire', Math.random() * .25);
  if (G.m && G.focus) $('stage').scrollIntoView({behavior:STILL ? 'auto' : 'smooth', block:'start'});
}
document.addEventListener('click', e => {
  const hit = a => e.target.closest(`[data-${a}]`);
  let el;
  if (hit('close') || e.target.id === 'veil') return closeDrawer();
  if (e.target.closest('a')) return;
  if (G.spot.size && !e.target.closest('#drawer') && !((el = hit('open') || hit('node')) && G.spot.has(el.dataset.open || el.dataset.node))){ clearSpot(); if (!hit('focus') && !hit('open') && !hit('node')) return; }
  if ((el = hit('theme-pick'))) return theme(el.dataset.themePick);
  if (hit('fold')) return setFull(!document.body.classList.contains('full'));
  if ((el = hit('focus'))) return setFocus(el.dataset.focus);
  if ((el = hit('more'))){ UI.logAll.has(el.dataset.more) ? UI.logAll.delete(el.dataset.more) : UI.logAll.add(el.dataset.more); return drawer(); }
  if ((el = hit('open') || hit('node'))){ UI.sel = el.dataset.open || el.dataset.node; G.hover = null; paint(); ring(UI.sel, G.nodes.get(UI.sel)?.c || 'wire'); return drawer(); }
});
const hov = on => e => { const el = e.target.closest?.('[data-node],[data-open]'); if (!el) return;
  const id = on ? (el.dataset.node || el.dataset.open) : null; if (id === 'core') return; if (G.hover !== id){ G.hover = id; paint(); } };
if (matchMedia('(hover:hover)').matches){ document.addEventListener('mouseover', hov(true)); document.addEventListener('mouseout', hov(false)); }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') return UI.sel ? closeDrawer() : clearSpot() || setFocus(null);
  if (e.key === '0') return setFocus(null);
  if (e.key === 'f' || e.key === 'F') return setFull(!document.body.classList.contains('full'));
  const f = FOCUS[+e.key - 1]; if (f) setFocus(f[0]);
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(build, 120); });

/* ---- 实时连接 ---- */
function apply(state){
  const now = new Map(state.tasks.map(t => [tkey(t), t.status])), changed = [];
  const byKey = new Map(state.tasks.map(t => [tkey(t), t]));
  if (UI.prev) for (const [k, s] of now) if (UI.prev.get(k) !== s){ const t = byKey.get(k); changed.push({k, s, old:UI.prev.get(k), id:t.id, title:t.title, p:t.projects[0]}); }
  UI.prev = now; UI.state = state; render();
  document.getElementById("vaultName").textContent = (state.vault || "").toUpperCase();
  if (changed.length && changed.length <= 8) spotlight(changed);
}
let heard = 0, lastState = '', lastUsage = '';
const live = (on, text) => { $('live').className = 'live' + (on ? '' : ' off'); $('live').textContent = on ? text || 'LIVE' : 'OFFLINE'; };
const setState = raw => { if (raw !== lastState){ lastState = raw; apply(JSON.parse(raw)); } };
const setUsage = raw => { if (raw !== lastUsage){ lastUsage = raw; UI.usage = JSON.parse(raw); coreView(); } };
function connect(){
  const es = new EventSource('api/events');   // 相对路径：挂在反向代理的子路径下也能用
  const ok = () => { heard = Date.now(); live(true); };
  es.onopen = ok;
  es.onmessage = e => { ok(); setState(e.data); };
  es.addEventListener('usage', e => { ok(); setUsage(e.data); });
  es.addEventListener('ping', ok);
  es.onerror = () => { if (Date.now() - heard > 40000) live(false); };   // EventSource 会自己重连
}
// 事件流被中间的代理缓冲、40 秒没动静时，退回每 5 秒轮询
setInterval(async () => {
  if (Date.now() - heard < 40000) return;
  try {
    const [s, u] = await Promise.all([fetch('api/state'), fetch('api/usage')]);
    if (!s.ok || !u.ok) throw 0;
    setState(await s.text()); setUsage(await u.text()); live(true, 'POLLING');
  } catch (e) { live(false); }
}, 5000);
const tick = () => { $('clock').textContent = new Date(Date.now() + 8 * 3600e3).toISOString().slice(11, 19) + ' CST'; };
let saved = 'teal'; try { saved = localStorage.getItem('board-theme-v2') || saved; } catch (e) {}
let full = false; try { full = !!localStorage.getItem('board-full'); } catch (e) {}
setFull(full); theme(saved); tick(); setInterval(tick, 1000); setInterval(fuPanel, 30000); connect(); requestAnimationFrame(frame);
</script>
</body>
</html>
